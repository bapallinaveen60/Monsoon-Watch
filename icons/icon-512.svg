<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0d1e3a"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="256" cy="256" r="230.4" fill="url(#glow)"/>

  <!-- Radar rings -->
  <circle cx="256" cy="256" r="113" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="4.096"/><circle cx="256" cy="256" r="195" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="4.096"/><circle cx="256" cy="256" r="276" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="4.096"/>

  <!-- Sweep wedge -->
  <path d="M256,256 L501.76,256 A245.76,245.76 0 0,0 468.83440323406364,133.12 Z"
    fill="rgba(56,189,248,0.18)"/>

  <!-- Sweep line -->
  <line x1="256" y1="256" x2="501.76" y2="256"
    stroke="rgba(56,189,248,0.7)" stroke-width="6.144" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12.8" fill="#38bdf8"/>

  <!-- Text: MW -->
  <text x="256" y="266"
    font-family="Arial Black, sans-serif"
    font-size="143" font-weight="900"
    fill="#ffffff" text-anchor="middle"
    letter-spacing="-1">MW</text>

  <!-- Text: subtitle -->
  <text x="256" y="348"
    font-family="Arial, sans-serif"
    font-size="51" font-weight="400"
    fill="rgba(56,189,248,0.8)" text-anchor="middle"
    letter-spacing="2">MONSOON</text>
</svg>