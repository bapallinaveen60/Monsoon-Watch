<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0d1e3a"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="96" height="96" rx="17" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="48" cy="48" r="43.2" fill="url(#glow)"/>

  <!-- Radar rings -->
  <circle cx="48" cy="48" r="21" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="1"/><circle cx="48" cy="48" r="36" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="1"/><circle cx="48" cy="48" r="52" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>

  <!-- Sweep wedge -->
  <path d="M48,48 L94.08,48 A46.08,46.08 0 0,0 87.90645060638693,24.960000000000004 Z"
    fill="rgba(56,189,248,0.18)"/>

  <!-- Sweep line -->
  <line x1="48" y1="48" x2="94.08" y2="48"
    stroke="rgba(56,189,248,0.7)" stroke-width="1.1520000000000001" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="48" cy="48" r="2.4000000000000004" fill="#38bdf8"/>

  <!-- Text: MW -->
  <text x="48" y="50"
    font-family="Arial Black, sans-serif"
    font-size="27" font-weight="900"
    fill="#ffffff" text-anchor="middle"
    letter-spacing="-1">MW</text>

  <!-- Text: subtitle -->
  <text x="48" y="65"
    font-family="Arial, sans-serif"
    font-size="10" font-weight="400"
    fill="rgba(56,189,248,0.8)" text-anchor="middle"
    letter-spacing="2">MONSOON</text>
</svg>