<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0d1e3a"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="72" height="72" rx="13" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="36" cy="36" r="32.4" fill="url(#glow)"/>

  <!-- Radar rings -->
  <circle cx="36" cy="36" r="16" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="1"/><circle cx="36" cy="36" r="27" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="1"/><circle cx="36" cy="36" r="39" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>

  <!-- Sweep wedge -->
  <path d="M36,36 L70.56,36 A34.56,34.56 0 0,0 65.9298379547902,18.720000000000002 Z"
    fill="rgba(56,189,248,0.18)"/>

  <!-- Sweep line -->
  <line x1="36" y1="36" x2="70.56" y2="36"
    stroke="rgba(56,189,248,0.7)" stroke-width="1" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="36" cy="36" r="2" fill="#38bdf8"/>

  <!-- Text: MW -->
  <text x="36" y="37"
    font-family="Arial Black, sans-serif"
    font-size="20" font-weight="900"
    fill="#ffffff" text-anchor="middle"
    letter-spacing="-1">MW</text>

  <!-- Text: subtitle -->
  <text x="36" y="49"
    font-family="Arial, sans-serif"
    font-size="7" font-weight="400"
    fill="rgba(56,189,248,0.8)" text-anchor="middle"
    letter-spacing="2">MONSOON</text>
</svg>